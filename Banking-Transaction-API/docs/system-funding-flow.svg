<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">System funding transaction flow</title>
  <desc id="desc">A system user authenticates, funds a customer account from a system account, and records the transfer atomically with a receiver email.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 z" fill="#385b68"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 z" fill="#a04a4a"/></marker><style>.bg{fill:#f6f8f7}.title{font:700 30px Arial;fill:#183642}.sub{font:16px Arial;fill:#58727a}.box{stroke:#91aab0;stroke-width:2;rx:14}.bt{font:700 17px Arial;fill:#183642}.tx{font:14px Arial;fill:#405e66}.flow{stroke:#385b68;stroke-width:3;fill:none;marker-end:url(#arrow)}.err{stroke:#a04a4a;stroke-width:3;fill:none;marker-end:url(#red)}.lb{font:600 13px Arial;fill:#385b68}.el{font:600 13px Arial;fill:#a04a4a}</style></defs>
  <rect class="bg" width="1400" height="760"/><text class="title" x="55" y="58">System initial funding</text><text class="sub" x="55" y="88">A protected internal funding operation: system account to customer account</text>
  <rect class="box" x="55" y="160" width="250" height="135" fill="#ebe4ef"/><text class="bt" x="80" y="200">System user</text><text class="tx" x="80" y="230">JWT contains system user ID</text><text class="tx" x="80" y="256">systemUser must be true</text><text class="tx" x="80" y="282">Calls /system/initial-funds</text>
  <rect class="box" x="365" y="160" width="250" height="135" fill="#e8f0e3"/><text class="bt" x="390" y="200">Authorization</text><text class="tx" x="390" y="230">Verify JWT and blacklist</text><text class="tx" x="390" y="256">Load system account</text><text class="tx" x="390" y="282">Validate amount and key</text>
  <rect class="box" x="675" y="160" width="250" height="135" fill="#f4eadc"/><text class="bt" x="700" y="200">Funding session</text><text class="tx" x="700" y="230">Start MongoDB transaction</text><text class="tx" x="700" y="256">Debit system balance</text><text class="tx" x="700" y="282">Require sufficient funds</text>
  <rect class="box" x="985" y="160" width="350" height="135" fill="#dceef0"/><text class="bt" x="1010" y="200">Customer credit</text><text class="tx" x="1010" y="230">Credit ACTIVE destination account</text><text class="tx" x="1010" y="256">Write transaction and ledger entries</text><text class="tx" x="1010" y="282">Set COMPLETED and commit</text>
  <path class="flow" d="M305 228 L365 228"/><path class="flow" d="M615 228 L675 228"/><path class="flow" d="M925 228 L985 228"/>

  <rect class="box" x="245" y="450" width="300" height="125" fill="#fff"/><text class="bt" x="270" y="490">Success</text><text class="tx" x="270" y="520">Customer balance increases</text><text class="tx" x="270" y="546">Receiver gets Resend email</text>
  <rect class="box" x="855" y="450" width="300" height="125" fill="#fff"/><text class="bt" x="880" y="490">Failure</text><text class="tx" x="880" y="520">Insufficient funds or inactive account</text><text class="tx" x="880" y="546">Abort session and roll back</text>
  <path class="flow" d="M1160 295 L395 450"/><text class="lb" x="690" y="375">commit</text><path class="err" d="M800 295 L1005 450"/><text class="el" x="850" y="370">abort</text>
  <text class="sub" x="55" y="675">This is internal account funding, not a card gateway, cash deposit, or bank withdrawal service.</text>
</svg>
