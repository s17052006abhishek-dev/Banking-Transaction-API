<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Authentication flow</title>
  <desc id="desc">Registration and login create a JWT. Protected requests pass through token extraction, blacklist checking, signature verification, user lookup, and authorization.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 z" fill="#385b68"/></marker>
    <marker id="red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 z" fill="#a04a4a"/></marker>
    <style>
      .bg{fill:#f6f8f7}.title{font:700 30px Arial;fill:#183642}.sub{font:16px Arial;fill:#58727a}.box{stroke:#91aab0;stroke-width:2;rx:14}.bt{font:700 18px Arial;fill:#183642}.tx{font:14px Arial;fill:#405e66}.flow{stroke:#385b68;stroke-width:3;fill:none;marker-end:url(#arrow)}.err{stroke:#a04a4a;stroke-width:3;fill:none;marker-end:url(#red)}.lb{font:600 13px Arial;fill:#385b68}.el{font:600 13px Arial;fill:#a04a4a}
    </style>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <text class="title" x="55" y="58">Authentication and authorization</text>
  <text class="sub" x="55" y="88">How registration, login, JWT validation, logout, and system-user access work</text>

  <rect class="box" x="55" y="150" width="250" height="145" fill="#dceef0"/><text class="bt" x="80" y="190">Client</text><text class="tx" x="80" y="220">Register or login request</text><text class="tx" x="80" y="246">Email + password + name</text><text class="tx" x="80" y="272">Cookie or Bearer token</text>
  <rect class="box" x="365" y="150" width="250" height="145" fill="#e8f0e3"/><text class="bt" x="390" y="190">Auth controller</text><text class="tx" x="390" y="220">Validate credentials</text><text class="tx" x="390" y="246">bcrypt password check</text><text class="tx" x="390" y="272">Create JWT for 3 days</text>
  <rect class="box" x="675" y="150" width="250" height="145" fill="#f4eadc"/><text class="bt" x="700" y="190">JWT middleware</text><text class="tx" x="700" y="220">Read token from cookie/header</text><text class="tx" x="700" y="246">Verify JWT signature</text><text class="tx" x="700" y="272">Decode user ID</text>
  <rect class="box" x="985" y="150" width="350" height="145" fill="#ebe4ef"/><text class="bt" x="1010" y="190">User context</text><text class="tx" x="1010" y="220">Check token blacklist</text><text class="tx" x="1010" y="246">Load user from MongoDB</text><text class="tx" x="1010" y="272">Attach user to req.user</text>
  <path class="flow" d="M305 222 L365 222"/><text class="lb" x="315" y="210">HTTPS</text><path class="flow" d="M615 222 L675 222"/><text class="lb" x="625" y="210">JWT issued</text><path class="flow" d="M925 222 L985 222"/><text class="lb" x="935" y="210">verify</text>

  <rect class="box" x="160" y="430" width="300" height="130" fill="#fff"/><text class="bt" x="185" y="470">Normal protected route</text><text class="tx" x="185" y="500">Account or user transfer</text><text class="tx" x="185" y="526">Ownership checks apply</text>
  <rect class="box" x="550" y="430" width="300" height="130" fill="#fff"/><text class="bt" x="575" y="470">System protected route</text><text class="tx" x="575" y="500">Initial funding endpoint</text><text class="tx" x="575" y="526">Requires systemUser: true</text>
  <rect class="box" x="940" y="430" width="300" height="130" fill="#fff"/><text class="bt" x="965" y="470">Authorized controller</text><text class="tx" x="965" y="500">Business logic executes</text><text class="tx" x="965" y="526">Request is linked to user</text>
  <path class="flow" d="M1160 295 L310 430"/><text class="lb" x="730" y="360">valid user JWT</text><path class="flow" d="M1160 295 L700 430"/><text class="lb" x="1000" y="370">system JWT</text><path class="flow" d="M460 495 L940 495"/><path class="flow" d="M850 495 L940 495"/>

  <path class="err" d="M985 295 L985 650 L700 650 L700 560"/><text class="el" x="760" y="675">invalid, expired, blacklisted, or unauthorized token - 401/403</text>
  <text class="sub" x="55" y="730">Logout stores the token in the blacklist. A TTL index removes blacklist records automatically after the token lifetime.</text>
</svg>
